<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fuit'Eau — Utilisateurs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#F0F4F8; --surface:#FFFFFF; --border:#D1DCE8;
  --primary:#0C5E8A; --primary-h:#0A4D72; --accent:#E05A20;
  --text:#1A2B3C; --muted:#6B7F93; --error:#C0392B; --success:#1A7A45;
  --shadow:0 2px 12px rgba(12,94,138,.10);
  color-scheme: light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1B2A;--surface:#162535;--border:#2A3F54;--primary:#2A8FBF;--primary-h:#3AA0D0;
  --text:#E2EAF0;--muted:#8BA4BA;--shadow:0 2px 12px rgba(0,0,0,.4);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1B2A;--surface:#162535;--border:#2A3F54;--primary:#2A8FBF;--primary-h:#3AA0D0;
  --text:#E2EAF0;--muted:#8BA4BA;--shadow:0 2px 12px rgba(0,0,0,.4);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.header{background:var(--primary);color:#fff;padding:.75rem max(1rem,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:.75rem;position:sticky;top:env(safe-area-inset-top,0px);
  z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.2)}
.header-logo{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0}
.header-icon{width:34px;height:34px;flex-shrink:0;background:rgba(255,255,255,.18);border-radius:8px;
  display:flex;align-items:center;justify-content:center}
.header-icon svg{width:20px;height:20px;fill:#fff}
.header-title{font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.header-sub{font-size:.72rem;opacity:.75}
.btn-icon{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.btn-icon:hover{background:rgba(255,255,255,.28)}
.btn-icon svg{width:18px;height:18px}
.nav-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:.35rem .75rem;
  border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.35rem}
.nav-back:hover{background:rgba(255,255,255,.28)}
.nav-back svg{width:16px;height:16px}

.content{padding:1rem max(1rem,env(safe-area-inset-left,0px));padding-bottom:3rem;max-width:700px}

.section-title{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:.6rem;margin-top:1.25rem}
.section-title:first-child{margin-top:0}

.user-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;
  box-shadow:var(--shadow)}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-weight:700;font-size:.95rem;color:#fff}
.user-info{flex:1;min-width:0}
.user-email{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.75rem;color:var(--muted);margin-top:.1rem}
.user-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0}

.role-select{padding:.3rem .5rem;border:1.5px solid var(--border);border-radius:6px;
  background:var(--bg);color:var(--text);font-size:.8rem;outline:none;cursor:pointer}
.role-select:focus{border-color:var(--primary)}

.toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:12px;background:var(--border);
  cursor:pointer;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--primary)}
.toggle-thumb{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .2s;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle input:checked~.toggle-thumb{transform:translateX(18px)}

.badge-role{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:10px;
  font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-super{background:#FEF3C7;color:#92400E}
.badge-agent{background:#DBEAFE;color:#1D4ED8}
.badge-cons{background:#F3E8FF;color:#6D28D9}
.badge-demo{background:#F3F4F6;color:#6B7280}

.toast{position:fixed;bottom:max(1.5rem,env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  background:#1A2B3C;color:#fff;padding:.55rem 1.1rem;border-radius:20px;
  font-size:.83rem;font-weight:600;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

.loader-wrap{text-align:center;padding:2rem;color:var(--muted);font-size:.88rem}
.access-denied{text-align:center;padding:3rem 1rem;color:var(--muted)}
.access-denied svg{width:48px;height:48px;fill:var(--border);display:block;margin:0 auto .75rem}
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C12 2 4 10.5 4 15a8 8 0 0016 0C20 10.5 12 2 12 2z"/></svg>
    </div>
    <div>
      <div class="header-title">Utilisateurs</div>
      <div class="header-sub">Fuit'Eau · Gestion des accès</div>
    </div>
  </div>
  <button class="nav-back" onclick="window.location.href='./fiches.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Fiches
  </button>
</header>

<div class="content" id="mainContent">
  <div class="loader-wrap">Chargement…</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL  = 'https://nygrwybqyrkqrkmszisv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55Z3J3eWJxeXJrcXJrbXN6aXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTEyMDIsImV4cCI6MjEwNzcyNzIwMn0.f-mZi4Pyq7Rbh9k1OUvr3ufp77i8xzybub4QO2VNWUM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let myId = '', myRole = '';

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('./index.html'); return; }

  const { data: p } = await sb.from('fuites_profils').select('role,actif').eq('id', session.user.id).single();
  if (!p || !p.actif) { await sb.auth.signOut(); window.location.replace('./index.html'); return; }

  myId   = session.user.id;
  myRole = p.role;

  if (myRole !== 'superadmin') {
    document.getElementById('mainContent').innerHTML = `
      <div class="access-denied">
        <svg viewBox="0 0 24 24"><path d="M12 1l3 6 6.5 1-4.7 4.5 1.1 6.5L12 16l-5.9 3 1.1-6.5L2.5 8 9 7z" opacity=".3"/></svg>
        Accès réservé aux administrateurs.
      </div>`;
    return;
  }

  loadUsers();
})();

async function loadUsers() {
  const { data: users, error } = await sb
    .from('fuites_profils')
    .select('*')
    .order('created_at', { ascending: true });

  if (error || !users) {
    document.getElementById('mainContent').innerHTML = '<div class="loader-wrap">Erreur de chargement.</div>';
    return;
  }

  const ROLES = [
    { val:'superadmin', label:'Super-admin', badge:'badge-super' },
    { val:'agent_rdf',  label:'Agent RDF',   badge:'badge-agent' },
    { val:'consultant', label:'Consultant',  badge:'badge-cons'  },
    { val:'demo',       label:'Démo',        badge:'badge-demo'  },
  ];
  const badgeClass = { superadmin:'badge-super', agent_rdf:'badge-agent', consultant:'badge-cons', demo:'badge-demo' };

  const actifs   = users.filter(u => u.actif);
  const inactifs = users.filter(u => !u.actif);

  function renderUser(u) {
    const initiale = (u.email||'?')[0].toUpperCase();
    const isMe = u.id === myId;
    const roleOptions = ROLES.map(r =>
      `<option value="${r.val}" ${u.role===r.val?'selected':''}>${r.label}</option>`
    ).join('');
    return `
    <div class="user-card" id="card-${u.id}">
      <div class="user-avatar">${initiale}</div>
      <div class="user-info">
        <div class="user-email">${u.email}</div>
        <div class="user-role">
          <span class="badge-role ${badgeClass[u.role]||''}">${u.role}</span>
          ${isMe ? ' <span style="font-size:.7rem;color:var(--muted)">(vous)</span>' : ''}
        </div>
      </div>
      <div class="user-actions">
        ${!isMe ? `
        <select class="role-select" onchange="changeRole('${u.id}', this.value)">${roleOptions}</select>
        <label class="toggle" title="${u.actif?'Désactiver':'Activer'}">
          <input type="checkbox" ${u.actif?'checked':''} onchange="toggleActif('${u.id}', this.checked)">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>` : '<span style="font-size:.75rem;color:var(--muted)">—</span>'}
      </div>
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="section-title">Comptes actifs (${actifs.length})</div>
    ${actifs.map(renderUser).join('')}
    ${inactifs.length ? `
    <div class="section-title" style="margin-top:1.5rem">Comptes désactivés (${inactifs.length})</div>
    ${inactifs.map(renderUser).join('')}` : ''}
  `;
}

async function changeRole(id, role) {
  const { error } = await sb.from('fuites_profils').update({ role }).eq('id', id);
  if (error) { showToast('Erreur : ' + error.message); return; }
  showToast('Rôle mis à jour');
  loadUsers();
}

async function toggleActif(id, actif) {
  const { error } = await sb.from('fuites_profils').update({ actif }).eq('id', id);
  if (error) { showToast('Erreur : ' + error.message); return; }
  showToast(actif ? 'Compte activé' : 'Compte désactivé');
  loadUsers();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
